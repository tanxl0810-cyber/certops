name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history with checksum-verified Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 120 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner

  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: npm --prefix ui ci --no-audit --no-fund
      - run: npm --prefix ui run build
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
      - run: python ops/test-pipeline-client.py
      - run: python ops/check-release.py

  compose-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python ops/init.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: python -m pip install httpx==0.28.1
      - run: python ops/smoke.py
      - name: PostgreSQL isolated tests
        run: >-
          docker compose run --rm --no-deps
          -v "$PWD/tests:/app/tests:ro" -v "$PWD/ops:/app/ops:ro"
          web sh -c 'CERTOPS_DEV_DATABASE_URL="$DATABASE_URL" python ops/test-postgres.py'
      - name: Verify non-superuser application role
        run: |
          role=$(docker compose exec -T db psql -U postgres -d postgres -At -c "SELECT rolname,rolsuper,rolcreatedb,rolcreaterole FROM pg_roles WHERE rolname='certops';")
          test "$role" = 'certops|f|f|f'
      - name: Collect failure diagnostics
        if: failure()
        run: docker compose logs --tail=80 web worker db
      - name: Stop CI containers
        if: always()
        run: docker compose down
